<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pnömatik Yapay Kas Sistemleri — YTÜ</title>
    <meta name="description" content="Pnömatik Yapay Kas Sistemleri (PAM) üzerine interaktif sunum — Yıldız Teknik Üniversitesi">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Cinematic Preloader -->
    <div id="preloader" class="preloader">
        <div class="preloader-content">
            <div class="preloader-logo">
                <div class="logo-icon-large">YTÜ</div>
            </div>
            <div class="preloader-text">Pnomatik Yapay Kas Sistemleri</div>
            <div class="preloader-bar-container">
                <div class="preloader-bar"></div>
            </div>
        </div>
    </div>

    <!-- Animated Mesh Gradient Orbs -->
    <div class="mesh-gradient-bg">
        <div class="mesh-orb mesh-orb-1"></div>
        <div class="mesh-orb mesh-orb-2"></div>
        <div class="mesh-orb mesh-orb-3"></div>
        <div class="mesh-orb mesh-orb-4"></div>
    </div>

    <!-- Floating Tech Ornaments -->
    <div class="ornaments-container">
        <div class="ornament ornament-crosshair" style="top: 15%; left: 10%;"></div>
        <div class="ornament ornament-ring" style="top: 70%; right: 15%;"></div>
        <div class="ornament ornament-dots" style="bottom: 20%; left: 25%;"></div>
        <div class="ornament ornament-crosshair" style="top: 30%; right: 25%; transform: scale(0.6); opacity: 0.3;"></div>
    </div>

    <!-- Cursor Spotlight -->
    <div class="cursor-spotlight" id="cursorSpotlight"></div>

    <!-- Particle Canvas Background -->
    <canvas id="particleCanvas"></canvas>

    <!-- Section Navigation - hover to expand -->
    <div class="section-nav" onmouseenter="openNav()" onmouseleave="closeNav()">
        <button class="nav-toggle">≡</button>
        <div class="nav-buttons collapsed" id="navButtons">
            <!-- Navigation buttons are auto-generated by generateNavButtons() in navigation.js -->
        </div>
    </div>

    <!-- Slide Container - sections will be loaded here -->
    <div class="slide-container" id="slide-container">
    </div>

    <!-- Logo Branding -->
    <div class="slide-logo">
        <div class="logo-icon">YTÜ</div>
        <span>Yıldız Teknik Üniversitesi</span>
    </div>

    <!-- Progress Bar -->
    <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <!-- Controls -->
    <div class="controls">
        <button onclick="prevSlide()" id="prevBtn">← Önceki</button>
        <span class="slide-counter" id="slideCounter">1 / 33</span>
        <button onclick="nextSlide()" id="nextBtn">Sonraki →</button>
    </div>

    <!-- Load scripts -->
    <script src="js/config.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/effects.js"></script>
</body>
</html>
